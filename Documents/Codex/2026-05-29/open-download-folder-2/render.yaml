services:
  - type: web
    name: qoohi
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: CAFE_ADMIN_PIN
        value: "1234"
      - key: DATABASE_URL
        fromDatabase:
          name: qoohi-db
          property: connectionString

databases:
  - name: qoohi-db
    databaseName: qoohi
    plan: free
